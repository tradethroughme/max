version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pilogram-postgres
    environment:
      POSTGRES_USER: pilogram
      POSTGRES_PASSWORD: pilogram123
      POSTGRES_DB: pilogram
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pilogram-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilogram"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pilogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pilogram-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: pilogram-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pilogram:pilogram123@postgres:5432/pilogram
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pilogram-network
    volumes:
      - ./backend/uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: pilogram-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - pilogram-network

volumes:
  postgres_data:
  redis_data:

networks:
  pilogram-network:
    driver: bridge
